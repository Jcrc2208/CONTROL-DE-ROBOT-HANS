<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Cobot Huayan</title>
    
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/dashboard.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

<div class="dashboard-container">

    <aside class="sidebar">
        <div class="logo">
            <span>HUAYAN</span> CONTROL
        </div>

        <nav class="sidebar-nav">
            <ul>
                <li>
                    <a href="telemetria.html" class="nav-item active">
                        <i class="fa-solid fa-chart-line"></i>
                        Telemetría
                    </a>
                </li>
                <li>
                    <a href="analicomponentes.html" class="nav-item">
                        <i class="fa-solid fa-brain"></i>
                        Análisis Predictivo
                    </a>
                </li>
                <li>
                    <a href="controUsers.html" class="nav-item">
                        <i class="fa-solid fa-users"></i>
                        Usuarios
                    </a>
                </li>
                <li>
                    <a href="index.html" class="logout-btn">
                        <i class="fa-solid fa-right-from-bracket"></i>
                        Cerrar Sesión
                    </a>
                </li>
            </ul>
        </nav>
    </aside>

    <main class="dashboard-content">

        <div class="telemetry-grid">

            <div class="cartesian-block">
                <h3>Posición Cartesiana</h3>

                <div id="pos-x">
                    X (mm)
                    <span>0.00</span>
                </div>

                <div id="pos-y">
                    Y (mm)
                    <span>0.00</span>
                </div>

                <div id="pos-z">
                    Z (mm)
                    <span>0.00</span>
                </div>

                <div id="rot-rx">
                    RX (°)
                    <span>0.00</span>
                </div>

                <div id="rot-ry">
                    RY (°)
                    <span>0.00</span>
                </div>

                <div id="rot-rz">
                    RZ (°)
                    <span>0.00</span>
                </div>
            </div>

            <div class="joints-block">
    <h3>Control Manual Articular (Jog)</h3>

    <div id="joint-j1" class="joint-row">
        <button class="btn-jog minus" data-joint="0" data-dir="-1">-</button>
        <span class="label">J1</span> <span class="val">0.0°</span>
        <button class="btn-jog plus" data-joint="0" data-dir="1">+</button>
    </div>

    <div id="joint-j2" class="joint-row">
        <button class="btn-jog minus" data-joint="1" data-dir="-1">-</button>
        <span class="label">J2</span> <span class="val">0.0°</span>
        <button class="btn-jog plus" data-joint="1" data-dir="1">+</button>
    </div>

    <div id="joint-j3" class="joint-row">
        <button class="btn-jog minus" data-joint="2" data-dir="-1">-</button>
        <span class="label">J3</span> <span class="val">0.0°</span>
        <button class="btn-jog plus" data-joint="2" data-dir="1">+</button>
    </div>

    <div id="joint-j4" class="joint-row">
        <button class="btn-jog minus" data-joint="3" data-dir="-1">-</button>
        <span class="label">J4</span> <span class="val">0.0°</span>
        <button class="btn-jog plus" data-joint="3" data-dir="1">+</button>
    </div>

    <div id="joint-j5" class="joint-row">
        <button class="btn-jog minus" data-joint="4" data-dir="-1">-</button>
        <span class="label">J5</span> <span class="val">0.0°</span>
        <button class="btn-jog plus" data-joint="4" data-dir="1">+</button>
    </div>

    <div id="joint-j6" class="joint-row">
        <button class="btn-jog minus" data-joint="5" data-dir="-1">-</button>
        <span class="label">J6</span> <span class="val">0.0°</span>
        <button class="btn-jog plus" data-joint="5" data-dir="1">+</button>
    </div>
</div>

            <!--- lo de las lineas punteadas --->  
            <div id="cobot-visual-area" style="position: relative; width: 100%; min-height: 400px; border: none !important; background: transparent !important; box-shadow: none !important;">
    </div>

        </div> 
    </main>

</div> 

<script src="js/main.js"></script>
<script src="js/telemetria.js"></script>


</body>
</html>
